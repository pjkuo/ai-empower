name: ipo-assets-decode
# 暫時性 workflow：把 _b64/ 內的 base64 分塊解碼為心智圖IPO教材二進位檔與更新頁，md5 驗證後自我清理。
# 觸發：推送 _b64/DONE；成功 commit 帶 [skip ci] 不會再觸發。
on:
  push:
    paths: ["_b64/DONE"]
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode & verify
        run: |
          set -e
          [ -f _b64/DONE ] || { echo "no DONE marker, skip"; exit 0; }
          mkdir -p assets/video assets/doc
          cat _b64/video.mp4.b64.*   | base64 -d > assets/video/mindmap-ipo-120s.mp4
          cat _b64/lesson.docx.b64.* | base64 -d > assets/doc/mindmap-ipo-lesson-plan.docx
          cat _b64/slides.pptx.b64.* | base64 -d > assets/doc/mindmap-ipo-slides-30min.pptx
          cat _b64/index.html.b64.*  | base64 -d > index.html
          cat _b64/assess.html.b64.* | base64 -d > assess.html
          md5sum -c <(printf '%s\n' \
            "d68ea82e38e42376c03e279168767777  assets/video/mindmap-ipo-120s.mp4" \
            "8af2e56a79cb4c808231de1792daceea  assets/doc/mindmap-ipo-lesson-plan.docx" \
            "d02fcf031503a1de5b42819efdac990c  assets/doc/mindmap-ipo-slides-30min.pptx" \
            "7d98be405659384117522350c90c7053  index.html" \
            "1fe1e01d7c9bae03024ab796b09beb7e  assess.html")
          rm -rf _b64
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "心智圖IPO：教材資產（影片/教案/簡報）＋首頁卡片與評量中心收錄（base64 解碼、md5 驗證）[skip ci]"
          git push

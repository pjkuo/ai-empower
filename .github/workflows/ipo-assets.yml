name: ipo-assets-decode
# 暫時性 workflow：把 _b64/ 內的 base64 分塊解碼為 index.html 與 assess.html 更新版，md5 驗證後自我清理。
# 觸發：推送 _b64/DONE；成功 commit 帶 [skip ci] 不會再觸發。完成後本檔由 MCP 另行刪除。
on:
  push:
    paths: ["_b64/DONE"]
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode & verify
        run: |
          set -e
          [ -f _b64/DONE ] || { echo "no DONE marker, skip"; exit 0; }
          cat _b64/index.html.b64.*  | base64 -d > index.html
          cat _b64/assess.html.b64.* | base64 -d > assess.html
          md5sum -c <(printf '%s\n' \
            "7d98be405659384117522350c90c7053  index.html" \
            "1fe1e01d7c9bae03024ab796b09beb7e  assess.html")
          rm -rf _b64
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "心智圖IPO：首頁專題創作區新增新生必學卡片＋評量中心收錄練習單（base64 解碼、md5 驗證）[skip ci]"
          git push

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/p1_patch.py
      - run: |
          git config user.name "pjkuo"
          git config user.email "kuo0615@gmail.com"
          git rm -q .github/workflows/p1-patch.yml .github/p1_patch.py
          git add -A

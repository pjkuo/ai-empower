name: video-fix-oneshot
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write zh subtitle track (WebVTT)
        run: |
          mkdir -p assets/video
          cat > assets/video/tutorial-zh.vtt <<'VTTEOF'
          WEBVTT

          1
          00:00:00.800 --> 00:00:05.060
          各位大一新生同學好，歡迎來到「AI 賦能教學平台」。

          2
          00:00:05.060 --> 00:00:11.460
          打開瀏覽器，輸入網址 pjkuo.github.io，第一件事是輸入學號後 4 碼，再按「進入教學平台」。

          3
          00:00:11.460 --> 00:00:17.891
          系統會依學號單雙號，自動分流到主站或備援站；兩站功能和成績完全相同。

          4
          00:00:18.591 --> 00:00:23.205
          這裡是「AI 賦能教學 Hub」，一個入口串起整個學習迴圈：

          5
          00:00:23.205 --> 00:00:29.548
          專題創作、IOC 課程模擬、課前評量、統計分析，往下都有各平台的卡片。

          6
          00:00:29.548 --> 00:00:33.496
          我們先點「開始做專題」，進入智慧專題創作平台。

          7
          00:00:34.196 --> 00:00:37.977
          進入平台後，先看「新生必看：四個步驟」：

          8
          00:00:37.977 --> 00:00:41.570
          心智圖、IPO 結構表、Python、簡報加影片，

          9
          00:00:41.570 --> 00:00:45.243
          也就是：想清楚、拆清楚、做出來、說出來。

          10
          00:00:45.243 --> 00:00:49.679
          每一步都能一鍵生成，但看懂、修改、驗證要由你負責，

          11
          00:00:49.679 --> 00:00:51.693
          這就是「先思考、後驗證」。

          12
          00:00:52.393 --> 00:00:56.691
          左側是五個步驟的清單，身分小卡已經帶入你的學號。

          13
          00:00:56.691 --> 00:01:01.142
          AI 由老師代管，班級碼預設就選好了，不用自己申請金鑰。

          14
          00:01:01.842 --> 00:01:05.289
          第一步：先填專題名稱和一句話描述，

          15
          00:01:05.289 --> 00:01:05.985
          例如「校園圖書館智慧借閱推薦系統」。

          16
          00:01:05.985 --> 00:01:11.319
          按下「一鍵生成」，系統會在 INPUT、PROCESS、OUTPUT 三個分支列出草稿，

          17
          00:01:11.319 --> 00:01:13.226
          並自動畫成心智圖。

          18
          00:01:13.226 --> 00:01:16.965
          你可以直接修改文字，再按「儲存並進入 IPO」。

          19
          00:01:17.665 --> 00:01:21.410
          第二步：心智圖自動變成三模組的 IPO 表格。

          20
          00:01:21.410 --> 00:01:26.541
          按「自動補充說明」，每一項會補上資料來源、處理方法和呈現格式。

          21
          00:01:26.541 --> 00:01:30.981
          表格逼你把話講具體；講得夠具體，程式才寫得出來。

          22
          00:01:30.981 --> 00:01:33.296
          也可以下載成 Excel 檔留存。

          23
          00:01:33.996 --> 00:01:38.989
          第三步：按「生成程式」，依照 IPO 表產生可以執行的 Python。

          24
          00:01:38.989 --> 00:01:42.318
          再按「在瀏覽器執行」，不用安裝任何軟體，

          25
          00:01:43.018 --> 00:01:46.158
          就能跑出模擬資料的統計結果和圖表。

          26
          00:01:46.158 --> 00:01:50.216
          對照 IPO 表檢查結果對不對，不對就回頭修改，

          27
          00:01:50.216 --> 00:01:53.808
          這就是「後驗證」：AI 出草稿，判斷的人是你。

          28
          00:01:54.508 --> 00:01:58.973
          第四步：心智圖、程式和圖表會自動彙整成簡報大綱。

          29
          00:01:58.973 --> 00:02:04.528
          填上作者，按「生成並下載 PowerPoint」，就得到一份完整的簡報檔。

          30
          00:02:05.228 --> 00:02:09.923
          接著按「生成影音腳本」，會自動產生四幕腳本、旁白和字幕；

          31
          00:02:09.923 --> 00:02:15.107
          再按「製作影片」，瀏覽器會直接錄成一段附字幕與背景音樂的短片，

          32
          00:02:15.107 --> 00:02:19.131
          也可以勾選麥克風，照著提詞機唸你自己的旁白。

          33
          00:02:19.831 --> 00:02:25.616
          最後「打包下載」，作品會依心智圖、IPO、程式、簡報、影片分好資料夾。

          34
          00:02:26.316 --> 00:02:30.992
          完成後，把畫面截圖上傳 Moodle，當作平時成績。

          35
          00:02:30.992 --> 00:02:33.189
          第一次走完大約十五分鐘；

          36
          00:02:33.189 --> 00:02:38.490
          作品存在同一台電腦的同一個瀏覽器，換電腦前記得先「匯出專案」。

          37
          00:02:39.190 --> 00:02:42.513
          跟著平台自己動手做一次，你會發現：

          38
          00:02:42.513 --> 00:02:46.487
          會用 AI，更要會判斷。現在就打開 pjkuo.github.io 開始吧！
          VTTEOF
      - name: Patch manual.html video section
        run: |
          python3 - <<'PYEOF'
          import re
          s = open('manual.html', encoding='utf-8').read()
          if 'youtube-nocookie' in s:
              print('already patched, skip')
          else:
              s = s.replace('<h3>中文旁白版（3 分 04 秒）</h3>', '<h3>中文旁白版（2 分 48 秒）</h3>', 1)
              iframe = '''<div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:#000">
                  <iframe src="https://www.youtube-nocookie.com/embed/6MPQFcjCr3c" title="AI賦能教學Hub 英文旁白中文字幕" style="position:absolute;inset:0;width:100%;height:100%;border:0" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>'''
              s, n = re.subn(r'<video[^>]*>\s*<source src="assets/video/tutorial-en\.mp4".*?</video>', iframe, s, count=1, flags=re.S)
              assert n == 1, 'en video block not found'
              s = s.replace(' poster="assets/img/video-poster.jpg"', '', 1)
              src = '<source src="assets/video/tutorial-zh.mp4" type="video/mp4">'
              assert s.count(src) == 1, 'zh source tag not unique'
              s = s.replace(src, src + '\n        <track kind="subtitles" srclang="zh-Hant" label="中文字幕" src="assets/video/tutorial-zh.vtt">', 1)
              open('manual.html', 'w', encoding='utf-8').write(s)
              print('manual.html patched')
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/video-fix-oneshot.yml
          git add -A
          git commit -m "fix: 教學影片區可播放 — 中文版接 assets/video/tutorial-zh.mp4(2:48)+字幕軌, 英文版改 YouTube 嵌入(6MPQFcjCr3c), 移除不存在的 poster" -m "One-shot workflow self-removed." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01Lrs7dXC4mxdS82MGrZ2SGU"
          git push

name: tmp-patch-ipo-kind
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-patch-ipo-kind.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply md5-gated patch (kind ipo)
        run: |
          cat > /tmp/p.py <<'PY'
          import json,hashlib,sys
          spec=json.loads('{"edits": {"weekly.html": [["checkin:\\"\\u5c08\\u984c\\u9032\\u5ea6\\u6253\\u5361\\"", "checkin:\\"\\u5c08\\u984c\\u9032\\u5ea6\\u6253\\u5361\\", ipo:\\"IPO \\u67b6\\u69cb\\u8868\\""], ["checkin:\\"project.html#ck\\"", "checkin:\\"project.html#ck\\", ipo:\\"mindmap-ipo.html\\""]], "teacher.html": [["project:\\"\\u5c08\\u984c\\",", "project:\\"\\u5c08\\u984c\\",ipo:\\"IPO \\u67b6\\u69cb\\u8868\\","], ["project:\\"#7C3AED\\",survey", "project:\\"#7C3AED\\",ipo:\\"#0891B2\\",survey"], ["[\\"quiz\\",\\"midterm\\",\\"exam\\",\\"repair\\",\\"build\\",\\"project\\",\\"assess4c\\"]", "[\\"quiz\\",\\"midterm\\",\\"exam\\",\\"repair\\",\\"build\\",\\"project\\",\\"ipo\\",\\"assess4c\\"]"], ["[\\"quiz\\",\\"midterm\\",\\"exam\\",\\"assess4c\\",\\"repair\\",\\"build\\",\\"project\\"]", "[\\"quiz\\",\\"midterm\\",\\"exam\\",\\"assess4c\\",\\"repair\\",\\"build\\",\\"project\\",\\"ipo\\"]"]], "unit-analysis.html": [["exam:\\"\\u8ab2\\u5f8c\\u8a55\\u91cf\\",posttest:\\"\\u5b78\\u7fd2\\u5f8c\\u6e2c\\"};", "exam:\\"\\u8ab2\\u5f8c\\u8a55\\u91cf\\",ipo:\\"IPO \\u67b6\\u69cb\\u8868\\",posttest:\\"\\u5b78\\u7fd2\\u5f8c\\u6e2c\\"};"], ["exam:\\"#1E3A8A\\",posttest:\\"#059669\\"};", "exam:\\"#1E3A8A\\",ipo:\\"#0891B2\\",posttest:\\"#059669\\"};"], ["spacing:\\"\\u9593\\u9694\\u7df4\\u7fd2\\"};", "spacing:\\"\\u9593\\u9694\\u7df4\\u7fd2\\",\\"mindmap-ipo\\":\\"\\u5fc3\\u667a\\u5716 \\u00d7 IPO\\"};"]], "moodle-sync.html": [["<option value=\\"exam\\">exam\\uff5c\\u8ab2\\u5f8c\\u8a55\\u91cf</option></select>", "<option value=\\"exam\\">exam\\uff5c\\u8ab2\\u5f8c\\u8a55\\u91cf</option><option value=\\"ipo\\">ipo\\uff5cIPO \\u67b6\\u69cb\\u8868\\uff08\\u4f5c\\u696d\\uff09</option></select>"]]}, "before": {"weekly.html": "0617e40441ead8c3869a7a27b77e48f4", "teacher.html": "89d2a14d7e9394e3492dc3d80d613533", "unit-analysis.html": "9afda03258476217a7315dadbe8290e1", "moodle-sync.html": "2b8d8f3ffffcc6b469623a10ba82b94b"}, "after": {"weekly.html": "3c54bb233f1849503f0bdb4d17c5586b", "teacher.html": "5cf3f83ff7209bfe62b6dcf067431189", "unit-analysis.html": "8b6fb92e6aec2c69e5f380747419c31b", "moodle-sync.html": "5ee8c849d57c0d855299644d05a6bfab"}}')
          ok=True
          for f,eds in spec["edits"].items():
              b=open(f,"rb").read()
              if hashlib.md5(b).hexdigest()!=spec["before"][f]: print("BEFORE MISMATCH",f); sys.exit(1)
              t=b.decode("utf-8")
              for o,n in eds:
                  if t.count(o)!=1: print("ANCHOR",f,o.encode("unicode_escape")); sys.exit(1)
                  t=t.replace(o,n)
              a=t.encode("utf-8")
              if hashlib.md5(a).hexdigest()!=spec["after"][f]: print("AFTER MISMATCH",f); sys.exit(1)
              open(f,"wb").write(a); print("patched",f)
          PY
          python3 /tmp/p.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add weekly.html teacher.html unit-analysis.html moodle-sync.html
          git commit -m "Add kind ipo (IPO architecture table) to weekly, teacher, unit-analysis, moodle-sync"
          git push

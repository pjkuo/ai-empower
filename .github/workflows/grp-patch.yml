name: grp-patch
on: push
permissions:
  contents: write
jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, 'grp-run') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/grp_patch.py
      - run: |
          git config user.name "pjkuo"
          git config user.email "kuo0615@gmail.com"
          git rm -q .github/workflows/grp-patch.yml .github/grp_patch.py
          git add -A
          git commit -m "任務分組：評量類歸為單一 UI（assess.html 評量中心）；首頁評量區四卡收斂為一卡、導覽列收斂；Router 未動" -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0132fkQFFpgYs7gD13EjefU8"

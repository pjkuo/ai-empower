name: tmp-patch-kpi-tab
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-patch-kpi-tab.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply md5-gated patch (KPI tab)
        run: |
          cat > /tmp/p.py <<'PY'
          import json,hashlib,sys
          spec=json.loads('{"edits": {"console.html": [["<button class=\\"tab\\" data-t=\\"msync\\">\\ud83d\\udd01 Moodle \\u6210\\u7e3e\\u540c\\u6b65</button>", "<button class=\\"tab\\" data-t=\\"msync\\">\\ud83d\\udd01 Moodle \\u6210\\u7e3e\\u540c\\u6b65</button>\\n      <button class=\\"tab\\" data-t=\\"kpi\\">\\ud83c\\udfaf AI-empower-KPI</button>"], ["<iframe id=\\"f_msync\\" title=\\"Moodle \\u6210\\u7e3e\\u540c\\u6b65\\"></iframe>", "<iframe id=\\"f_msync\\" title=\\"Moodle \\u6210\\u7e3e\\u540c\\u6b65\\"></iframe>\\n      <iframe id=\\"f_kpi\\" title=\\"AI-empower-KPI\\"></iframe>"], ["msync:\\"moodle-sync.html\\"};", "msync:\\"moodle-sync.html\\",kpi:\\"kpi.html\\"};"]], "README.md": [["\\uff0b\\u81ea\\u52d5\\u4eba\\u6a5f\\u5354\\u4f5c\\u8072\\u660e |\\n", "\\uff0b\\u81ea\\u52d5\\u4eba\\u6a5f\\u5354\\u4f5c\\u8072\\u660e |\\n| `kpi.html` | AI-empower-KPI\\uff1a\\u4ee5 HITL\\uff0fHOTL\\uff0fHOOTL \\u70ba\\u53c3\\u6578\\u7684\\u4e09\\u5c64\\u8a55\\u91cf\\u6307\\u6a19\\uff0810 \\u9805 KPI\\u3001\\u9598\\u9580\\u52a0\\u6b0a\\u7d9c\\u5408\\u6307\\u6a19\\uff09\\uff0c\\u4e26\\u8207\\u8ad6\\u6587\\u6210\\u6548\\u57fa\\u7dda\\uff08M1\\u2013M9\\uff09\\u5c0d\\u7167\\uff1b\\u6559\\u5e2b\\u5de5\\u4f5c\\u53f0\\u300c\\ud83c\\udfaf AI-empower-KPI\\u300d\\u5206\\u9801 |\\n"]]}, "before": {"console.html": "2a0ef1b688d6ddb7a19528ed00e5d0f2", "README.md": "0904de0e31fc24c3482e5d0d05272fc8"}, "after": {"console.html": "3dbef3a3fa6e1d8bcdb4cbdce0aca615", "README.md": "124a50848d652fea444ac15f25ec3541"}}')
          for f,eds in spec["edits"].items():
              b=open(f,"rb").read()
              if hashlib.md5(b).hexdigest()!=spec["before"][f]: print("BEFORE MISMATCH",f); sys.exit(1)
              t=b.decode("utf-8")
              for o,n in eds:
                  if t.count(o)!=1: print("ANCHOR",f,o.encode("unicode_escape")); sys.exit(1)
                  t=t.replace(o,n)
              a=t.encode("utf-8")
              if hashlib.md5(a).hexdigest()!=spec["after"][f]: print("AFTER MISMATCH",f); sys.exit(1)
              open(f,"wb").write(a); print("patched",f)
          PY
          python3 /tmp/p.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add console.html README.md
          git commit -m "Add AI-empower-KPI tab to console and README"
          git push

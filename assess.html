<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的評量中心｜ai-empower</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="AI 賦能教學平台">
<meta property="og:title" content="我的評量中心｜ai-empower">
<meta property="og:description" content="這學期所有要作答的項目都在這一頁：時機、時長、計不計分一目了然，完成的自動打勾。">
<meta name="description" content="這學期所有要作答的項目都在這一頁：時機、時長、計不計分一目了然，完成的自動打勾。">
<meta name="theme-color" content="#1E3A8A">
<link rel="canonical" href="https://pjkuo.github.io/ai-empower/assess.html">
<meta name="cc-cloud-url" content="https://script.google.com/macros/s/AKfycbz7wHWbc7go-OVR0Q_g_NBzDqwzV9-leqL1CRe1S9wGkLLjvJIAm-KrZj80s1KJ_VdGVg/exec">
<link rel="icon" href="https://pjkuo.github.io/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/ae.css">
<script src="assets/theme.js"></script>
<script src="assets/identity.js"></script>
<style>
/* ---- 我的評量中心 專頁樣式 ---- */
.phead{background:linear-gradient(120deg,var(--primary),var(--primary-2) 55%,#5B6FE0);color:#fff;border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin:18px 0;position:relative;overflow:hidden}
.phead>*{position:relative;z-index:1}
.phead h1{font-size:21px;line-height:1.3}
.phead h1 .en{font-size:12px;font-weight:600;opacity:.9;margin-left:8px}
.phead p{font-size:13px;opacity:.93;margin-top:6px;max-width:760px}
.phead .idrow{margin-top:12px;max-width:620px}
.aslist{display:grid;gap:12px;max-width:860px;margin:0 auto}
.asitem{background:var(--card,#fff);border:1px solid var(--line,#e2e8f0);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start}
@media(max-width:560px){.asitem{grid-template-columns:38px 1fr}.asitem .asbtns{grid-column:1/-1}}
.asic{font-size:26px;line-height:1.2;text-align:center}
.asname{font-size:16px;font-weight:800}
.asmeta{font-size:12.5px;color:var(--muted,#64748b);margin-top:2px}
.asmeta b{color:var(--ink,#0f172a)}
.asdesc{font-size:13px;color:var(--muted,#475569);margin-top:5px;line-height:1.6}
.asbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.asgo{display:inline-block;background:var(--primary);color:#fff;border-radius:10px;padding:8px 14px;text-decoration:none;font-weight:700;font-size:13.5px;white-space:nowrap}
.asgo.ghost{background:var(--bg2,#f1f5f9);color:var(--ink,#0f172a);border:1px solid var(--line,#e2e8f0)}
.badge-done{display:inline-block;background:#D1FAE5;color:#065F46;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.badge-todo{display:inline-block;background:#FEF3C7;color:#92400E;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.badge-run{display:inline-block;background:#DBEAFE;color:#1E40AF;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.results{max-width:860px;margin:18px auto 0;background:var(--bg2,#f8fafc);border:1.5px dashed var(--line,#cbd5e1);border-radius:14px;padding:14px 18px}
.results h2{font-size:15px;margin-bottom:8px}
.results a{display:inline-block;margin:4px 10px 4px 0;font-weight:700}
.note{max-width:860px;margin:10px auto 0;font-size:11.5px;color:var(--muted,#94a3b8);text-align:right}
</style>
</head>
<body>
<main class="wrap" style="max-width:920px;margin:0 auto;padding:0 16px 40px">
  <header class="phead">
    <h1>📝 我的評量中心<span class="en">My Assessments</span></h1>
    <p>這學期所有要作答的項目都在這一頁：什麼時候做、要多久、計不計分，一目了然。填了身分，完成的項目會自動打勾。</p>
    <div class="idrow" data-aeid></div>
  </header>

  <div class="aslist" id="asList"></div>

  <div class="results">
    <h2>📊 作答完想看成果？</h2>
    <a href="start.html">📍 我的起點報告</a>
    <a href="weekly.html">📈 我的學習週報</a>
  </div>
  <p class="note" id="asNote"></p>
</main>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var DEMO=/[?&]demo=1/.test(location.search);

/* 全學期評量項目（單一真相清單） */
var ITEMS=[
 {ic:"📋",name:"課前評量",when:"第 1–2 週",mins:"約 8 分鐘",graded:"不計分",kinds:["presurvey"],
  desc:"27 題六向度，了解你的起點。交卷後看「起點報告」拿你的第一步建議。",
  btns:[["開始作答","presurvey.html",""],["📍 起點報告","start.html","ghost"]]},
 {ic:"🧩",name:"運算思維四大技巧練習",when:"第 2–3 週",mins:"12–15 分鐘",graded:"不計分",kinds:["ctpractice"],
  desc:"用校園生活情境（搶票、排隊、揪團、擺攤）各練一次拆解、找規律、抽象化、演算法。",
  btns:[["開始練習","ct-practice.html",""]]},
 {ic:"🧠",name:"心智圖IPO 練習單",when:"第 3–4 週・專題啟動前",mins:"約 15 分鐘",graded:"不計分",kinds:["ipopractice"],
  desc:"新生必學運算思維基礎能力：用心智圖拆問題、用 IPO 找規律——線上完成 O→I 串接檢查與 AI 決策紀錄。",
  btns:[["開始練習","ipo-worksheet.html",""],["📖 單元教材","mindmap-ipo.html","ghost"]]},
 {ic:"🃏",name:"IPOS 課堂問卷 × 即時互動",when:"課堂任務（依老師指示）",mins:"隨堂",graded:"不計分",kinds:["survey"],
  desc:"從超商自助結帳等校園情境，判斷輸入 I → 處理 P → 輸出 O → 儲存 S；配合課堂投影即時互動。",
  btns:[["課堂問卷","https://pjkuo.github.io/IOC-platform/survey.html",""],["⚡ 即時互動","https://pjkuo.github.io/IOC-platform/live.html","ghost"]]},
 {ic:"🖥",name:"每週單元評量",when:"每週（隨課程進度）",mins:"隨堂",graded:"平時成績",kinds:["warm","subquiz","quiz"],ongoing:true,
  desc:"跟著「本週學習」走：暖身小題 → 互動模擬 → 講義小測，做完自動記錄。",
  btns:[["進入本週學習","ioc.html",""]]},
 {ic:"🎯",name:"4C 學習成效評量",when:"前測第 2–4 週・後測期末",mins:"約 10 分鐘",graded:"不計分",kinds:["assess4c"],
  desc:"12 題核心素養＋4 題教學效能，學號自動配對前後測。（40 題學習後測問卷在 AI 賦能學習平台側欄）",
  btns:[["開始作答","https://pjkuo.github.io/AICT-assess-platform/",""]]},
 {ic:"🏁",name:"期中／期末評量",when:"依課程公告",mins:"—",graded:"計分",kinds:["midterm","exam"],
  desc:"於課程模擬平台內進行，時間與範圍以 Moodle 公告為準。",
  btns:[["前往課程平台","ioc.html","ghost"]]}
];

function badge(st){
  if(st.done) return '<span class="badge-done">✓ 已完成 '+st.date+'</span>';
  if(st.count) return '<span class="badge-run">進行中 · 已記錄 '+st.count+' 筆</span>';
  if(st.unknown) return '';
  return '<span class="badge-todo">○ 未完成</span>';
}
function render(statusByKind){
  var h="";
  ITEMS.forEach(function(it){
    var st={unknown:!statusByKind};
    if(statusByKind){
      var recs=[]; it.kinds.forEach(function(k){ (statusByKind[k]||[]).forEach(function(r){recs.push(r);}); });
      if(it.ongoing){ st={count:recs.length}; }
      else if(recs.length){ recs.sort(function(a,b){return String(a.ts)<String(b.ts)?-1:1;}); st={done:true,date:String(recs[recs.length-1].ts||"").slice(5,10).replace("-","/")} ; }
      else st={};
    }
    var btns=it.btns.map(function(b){return '<a class="asgo '+(b[2]||"")+'" href="'+b[1]+'">'+b[0]+'</a>';}).join("");
    h+='<div class="asitem"><div class="asic">'+it.ic+'</div><div>'+
       '<div class="asname">'+it.name+'</div>'+
       '<div class="asmeta">🗓 <b>'+it.when+'</b>　⏱ '+it.mins+'　🧮 '+it.graded+'</div>'+
       '<div class="asdesc">'+it.desc+'</div></div>'+
       '<div class="asbtns">'+badge(st)+btns+'</div></div>';
  });
  $("asList").innerHTML=h;
}
function statusFromRecords(records){
  var by={};
  (records||[]).forEach(function(r){ (by[r.kind]=by[r.kind]||[]).push(r); });
  return by;
}
function load(){
  if(DEMO){
    render(statusFromRecords([
      {kind:"presurvey",ts:"2026-09-15T10:00:00"},
      {kind:"warm",ts:"2026-09-16"},{kind:"subquiz",ts:"2026-09-16"},{kind:"quiz",ts:"2026-09-17"}
    ]));
    $("asNote").textContent="示範資料（?demo=1）"; return;
  }
  render(null); /* 先渲染清單，不等雲端 */
  var id=(window.AEId&&AEId.get())||null;
  if(!id||!id.sid){ $("asNote").textContent="填上方身分後，完成狀態會自動顯示。"; return; }
  var m=document.querySelector('meta[name="cc-cloud-url"]');
  var u=m?m.getAttribute("content"):"";
  if(!/^https?:/.test(u)) return;
  $("asNote").textContent="完成狀態查詢中…";
  fetch(u+"?action=me&sid="+encodeURIComponent(id.sid)+"&cls="+encodeURIComponent(id.cls||""))
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.ok&&j.records){ render(statusFromRecords(j.records)); $("asNote").textContent="完成狀態依你的雲端紀錄自動更新。"; }
      else $("asNote").textContent="";
    })
    .catch(function(){ $("asNote").textContent="（目前離線，僅顯示清單）"; });
}
document.addEventListener("ae:identity",load);
window.addEventListener("DOMContentLoaded",load);
})();
</script>
</body>
</html>

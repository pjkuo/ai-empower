.taskbar .wrap{display:flex;align-items:center;gap:10px;padding:8px 18px;flex-wrap:wrap}
.taskbar .tag{font-size:12.5px;font-weight:800;color:#3d6017;white-space:nowrap}
.taskbar .desc{font-size:11.5px;color:#4c5d38;line-height:1.5}
.taskbar .desc b{color:#33500f}
.taskbar .spacer{flex:1}
.taskbar .ext{font-size:12px;font-weight:800;color:#2f4a10;background:#c4dd9f;
  border-radius:16px;padding:6px 14px;white-space:nowrap;transition:.14s}
.taskbar .ext:hover{filter:brightness(1.05)}
@media(max-width:720px){
  .taskbar{position:static}
  .taskbar .desc{display:none}
  .taskbar .spacer{flex:0 0 4px}
}
.stage{flex:1;display:flex;min-height:0;position:relative}

.loader.hide{opacity:0;pointer-events:none}
.loader .spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--primary);
  border-radius:50%;animation:sp 1s linear infinite}
.loader p{font-size:13px;color:var(--muted);font-weight:700}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loader .spin{animation:none}}

<div class="stage">
  <div class="loader" id="loader" aria-hidden="true"><div class="spin"></div><p>問卷載入中…</p></div>
  <iframe id="survey" title="校園情境卡 IPOS 拆解問卷"
          src="https://ap.surveymars.com/q/7XchtP96e?collect=12&width=912&height=700&source=iframe&s=t"
          allow="fullscreen"></iframe>
</div>
<div class="fallback card" id="fb">
  <h2>問卷載入中…</h2>
  <p class="sub">若長時間沒有出現內容，可能是網路受限或嵌入被阻擋，請改用
    <a href="https://ap.surveymars.com/q/7XchtP96e" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">直接開啟問卷</a>。</p>
</div>

<script>
(function(){
  "use strict";
  var iframe=document.getElementById("survey"), loaded=false;
  iframe.addEventListener("load",function(){
    loaded=true;
    var l=document.getElementById("loader");
    if(l){ l.classList.add("hide"); setTimeout(function(){ l.remove(); },450); }
  });
  setTimeout(function(){
    if(!loaded){
      document.getElementById("fb").style.display="block";
      var l=document.getElementById("loader");
      if(l){ l.classList.add("hide"); setTimeout(function(){ l.remove(); },450); }
    }
  },8000);
})();
</script>
